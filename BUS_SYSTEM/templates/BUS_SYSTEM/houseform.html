{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Property | DistarGroup</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.4);
            --secondary: #64748b;
            --success: #10b981;
            --bg-body: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-dark: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            margin: 0;
            background: radial-gradient(circle at top right, #e2e8f0, #f1f5f9);
            color: var(--text-dark);
            min-height: 100vh;
        }

        header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 1.2rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        header .logo { font-size: 1.6rem; font-weight: 800; letter-spacing: -1px; }
        header .logo span { color: var(--primary); }
        header nav a { color: #cbd5e1; text-decoration: none; margin-left: 25px; font-weight: 600; font-size: 0.95rem; transition: 0.3s; }
        header nav a:hover { color: var(--primary); }

        .container { max-width: 850px; margin: 50px auto; padding: 0 20px; }

        .stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            position: relative;
        }

        .stepper::before {
            content: "";
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--border);
            z-index: 1;
        }

        .step-progress-bar {
            position: absolute;
            top: 20px;
            left: 0;
            height: 3px;
            background: var(--primary);
            width: 0%;
            z-index: 2;
            transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .step {
            position: relative;
            z-index: 3;
            background: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--border);
            font-weight: 700;
            transition: 0.4s;
            color: var(--text-light);
        }

        .step.active { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
        .step.completed { background: var(--primary); border-color: var(--primary); color: #fff; }

        .form-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.7);
        }

        .form-step { display: none; }
        .form-step.active { display: block; animation: slideUp 0.6s ease forwards; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header { margin-bottom: 30px; }
        .section-header h2 { font-size: 1.8rem; font-weight: 800; color: var(--text-dark); margin: 0; }
        .section-header p { color: var(--text-light); margin-top: 5px; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; }
        .form-field label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; text-transform: uppercase; }
        
        .input-group { position: relative; }
        .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-light); }

        input, select, textarea {
            padding: 14px 14px 14px 48px;
            font-size: 1rem;
            border-radius: 12px;
            border: 2px solid var(--border);
            width: 100%;
            background: #fff;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }

        .upload-area {
            border: 2px dashed var(--primary);
            background: rgba(37, 99, 235, 0.02);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
        }

        #image-preview { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 15px; margin-top: 20px; }
        .preview-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; }

        .btn-group { display: flex; gap: 20px; margin-top: 40px; }
        button { padding: 16px 30px; font-weight: 700; border-radius: 12px; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-next { background: var(--primary); color: white; flex: 2; }
        .btn-prev { background: #e2e8f0; color: var(--text-dark); flex: 1; }

        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <div class="logo">Distar<span>Group</span></div>
    <nav>
        <a href="/">Home</a>
        <a href="#"><i class="fas fa-plus-circle"></i> Submit Property</a>
    </nav>
</header>

<div class="container">
    <div class="stepper">
        <div class="step-progress-bar" id="progress"></div>
        <div class="step active" id="s1">1</div>
        <div class="step" id="s2">2</div>
        <div class="step" id="s3">3</div>
    </div>

    <div class="form-box">
        <form id="propertyForm" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <input type="hidden" name="stock" value="1">
            <input type="hidden" name="discount" value="0">

            <div class="form-step active" id="step-1">
                <div class="section-header">
                    <h2>Property Identity</h2>
                    <p>Primary details about your listing.</p>
                </div>
                <div class="grid">
                    <div class="form-field">
                        <label>Property Title</label>
                        <div class="input-group">
                            <i class="fas fa-house-chimney"></i>
                            <input type="text" name="title" placeholder="e.g. Modern Apartment" required>
                        </div>
                    </div>
                    <div class="form-field">
                        <label>Price (RWF)</label>
                        <div class="input-group">
                            <i class="fas fa-tag"></i>
                            <input type="number" name="price" placeholder="Amount" required>
                        </div>
                    </div>
                    <div class="form-field">
                        <label>Property Type</label>
                        <div class="input-group">
                            <i class="fas fa-building"></i>
                            <select name="property_type" required>
                                <option value="">Select Type</option>
                                {% for value, label in property_types %}
                                    <option value="{{ value }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="form-field">
                        <label>Listing Mode</label>
                        <div class="input-group">
                            <i class="fas fa-key"></i>
                            <select name="property_term" required>
                                <option value="Rent">For Rent</option>
                                <option value="Sale">For Sale</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-field">
                        <label>Location</label>
                        <div class="input-group">
                            <i class="fas fa-location-dot"></i>
                            <input name="location" placeholder="City, District" required>
                        </div>
                    </div>
                    <div class="form-field">
                        <label>Year Built</label>
                        <div class="input-group">
                            <i class="fas fa-calendar-days"></i>
                            <input type="number" name="year_built" placeholder="Year">
                        </div>
                    </div>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn-next" onclick="goToStep(2)">Features & Specs <i class="fas fa-chevron-right"></i></button>
                </div>
            </div>

            <div class="form-step" id="step-2">
                <div class="section-header">
                    <h2>Property Features</h2>
                    <p>Interior and exterior specifications.</p>
                </div>
                <div class="grid">
                    <div class="form-field">
                        <label>Bedrooms</label>
                        <div class="input-group">
                            <i class="fas fa-bed"></i>
                            <input type="number" name="bedrooms" placeholder="Count">
                        </div>
                    </div>
                    <div class="form-field">
                        <label>Bathrooms</label>
                        <div class="input-group">
                            <i class="fas fa-bath"></i>
                            <input type="number" name="bathrooms" placeholder="Count">
                        </div>
                    </div>
                    <div class="form-field">
                        <label>Furnished</label>
                        <div class="input-group">
                            <i class="fas fa-couch"></i>
                            <select name="furnished">
                                <option value="No">No</option>
                                <option value="Yes">Yes</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-field">
                        <label>Parking</label>
                        <div class="input-group">
                            <i class="fas fa-car"></i>
                            <select name="parking">
                                <option value="No">No</option>
                                <option value="Yes">Yes</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-field">
                        <label>Balcony</label>
                        <div class="input-group">
                            <i class="fas fa-door-open"></i>
                            <select name="balcony">
                                <option value="No">No</option>
                                <option value="Yes">Yes</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-field">
                        <label>Plot Area (sqm)</label>
                        <div class="input-group">
                            <i class="fas fa-ruler-combined"></i>
                            <input type="number" name="plot_area" placeholder="Size">
                        </div>
                    </div>
                    <div class="form-field" style="grid-column: span 2;">
                        <label>Description</label>
                        <textarea name="description" placeholder="Describe garden, security..."></textarea>
                    </div>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn-prev" onclick="goToStep(1)">Back</button>
                    <button type="button" class="btn-next" onclick="goToStep(3)">Media & Contact <i class="fas fa-chevron-right"></i></button>
                </div>
            </div>

            <div class="form-step" id="step-3">
                <div class="section-header">
                    <h2>Media & Finalize</h2>
                    <p>Add photos and contact information.</p>
                </div>
                
                <div class="form-field">
                    <label>Gallery (Max 8 Photos)</label>
                    <div class="upload-area" onclick="document.getElementById('file-input').click()">
                        <i class="fas fa-images fa-3x" style="color: var(--primary); margin-bottom: 10px;"></i>
                        <p>Click to upload photos</p>
                        <input type="file" id="file-input" name="images" multiple accept="image/*" style="display:none">
                    </div>
                    <div id="image-preview"></div>
                </div>

                <div class="grid" style="margin-top: 25px;">
                    <div class="form-field">
                        <label>Realtor Name</label>
                        <div class="input-group">
                            <i class="fas fa-user-tie"></i>
                            <input type="text" name="realtor" placeholder="Name" required>
                        </div>
                    </div>
                    <div class="form-field">
                        <label>WhatsApp / Phone</label>
                        <div class="input-group">
                            <i class="fab fa-whatsapp"></i>
                            <input type="tel" name="phone" placeholder="+250..." required>
                        </div>
                    </div>
                    <div class="form-field" style="grid-column: span 2;">
                        <label>Email Address</label>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" name="email" placeholder="email@example.com" required>
                        </div>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn-prev" onclick="goToStep(2)">Back</button>
                    <button type="submit" class="btn-next" style="background: var(--success);">Publish Property <i class="fas fa-check"></i></button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    function goToStep(step) {
        document.querySelectorAll('.form-step').forEach(s => s.classList.remove('active'));
        document.getElementById('step-' + step).classList.add('active');
        
        document.querySelectorAll('.step').forEach((s, idx) => {
            if (idx + 1 < step) {
                s.classList.add('completed');
                s.innerHTML = '<i class="fas fa-check"></i>';
            } else if (idx + 1 === step) {
                s.classList.add('active');
                s.classList.remove('completed');
                s.innerHTML = step;
            } else {
                s.classList.remove('active', 'completed');
                s.innerHTML = idx + 1;
            }
        });

        document.getElementById('progress').style.width = ((step - 1) / 2) * 100 + '%';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('file-input').addEventListener('change', function() {
        const preview = document.getElementById('image-preview');
        preview.innerHTML = '';
        Array.from(this.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.classList.add('preview-img');
                preview.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    });
</script>
</body>
</html>
