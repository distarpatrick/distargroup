{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment | {{ vehicle.brand }} {{ vehicle.model }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",sans-serif;}
body{background:#f4f6f8;color:#1f2937;}

.container{
    max-width:1100px;
    margin:40px auto;
    padding:20px;
}

/* ===== PAYMENT GRID ===== */
.payment-grid{
    display:grid;
    grid-template-columns:1.2fr 1fr;
    gap:30px;
}

/* ===== PRODUCT CARD ===== */
.product-card{
    background:#fff;
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}
.product-card img{
    width:100%;
    height:280px;
    object-fit:cover;
    border-radius:16px;
}
.product-info{
    margin-top:20px;
}
.product-info h2{
    font-size:24px;
}
.product-info span{
    color:#6b7280;
    font-size:14px;
}
.product-price{
    margin-top:15px;
    font-size:32px;
    font-weight:900;
    color:#16a34a;
}

/* ===== PAYMENT CARD ===== */
.payment-card{
    background:#fff;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}
.payment-card h3{
    margin-bottom:20px;
}

/* ===== PAYMENT METHODS ===== */
.method{
    display:flex;
    align-items:center;
    gap:15px;
    padding:14px;
    border:2px solid #e5e7eb;
    border-radius:14px;
    margin-bottom:15px;
    cursor:pointer;
    transition:.3s;
}
.method:hover{
    border-color:#16a34a;
    background:#f0fdf4;
}
.method input{
    accent-color:#16a34a;
}
.method i{
    font-size:26px;
    color:#16a34a;
}

/* ===== PAY BUTTON ===== */
.pay-btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:30px;
    background:#16a34a;
    color:#fff;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    transition:.3s;
}
.pay-btn:hover{
    background:#15803d;
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(22,163,74,.4);
}

.secure{
    margin-top:15px;
    font-size:13px;
    color:#6b7280;
    text-align:center;
}

@media(max-width:900px){
    .payment-grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="container">

<h2><i class="fa fa-credit-card"></i> Secure Payment</h2>

<div class="payment-grid">

<!-- PRODUCT SUMMARY -->
<div class="product-card">
    {% if vehicle.images.first.image %}
        <img src="{{ vehicle.images.first.image.url }}">
    {% endif %}

    <div class="product-info">
        <h2>{{ vehicle.brand }} {{ vehicle.model }}</h2>
        <span>{{ vehicle.condition }} • {{ vehicle.fuel_type }}</span>

        <div class="product-price">
            ${{ vehicle.price }}
        </div>
    </div>
</div>

<!-- PAYMENT METHODS -->
<div class="payment-card">
    <h3>Select Payment Method</h3>

    <label class="method">
        <input type="radio" name="payment" checked>
        <i class="fa fa-mobile-screen"></i>
        <div>
            <strong>Mobile Money</strong><br>
            <small>MTN / Airtel</small>
        </div>
    </label>

    <label class="method">
        <input type="radio" name="payment">
        <i class="fa fa-credit-card"></i>
        <div>
            <strong>Bank Card</strong><br>
            <small>Visa / MasterCard</small>
        </div>
    </label>

    <label class="method">
        <input type="radio" name="payment">
        <i class="fa fa-building-columns"></i>
        <div>
            <strong>Bank Transfer</strong><br>
            <small>Direct Deposit</small>
        </div>
    </label>

    <button class="pay-btn" onclick="processPayment()">
        <i class="fa fa-lock"></i> Pay ${{ vehicle.price }}
    </button>

    <div class="secure">
        <i class="fa fa-shield-halved"></i> 100% Secure Payment
    </div>
</div>

</div>
</div>

<script>
function processPayment(){
    alert("Payment processing started for {{ vehicle.brand }} {{ vehicle.model }}");
}
</script>

</body>
</html>
