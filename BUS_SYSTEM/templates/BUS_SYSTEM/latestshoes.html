{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilePage | Shop the Collection</title>
    <style>
        /* CSS Reset & Typography */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #111;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Product Card */
        .product-card {
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .image-container {
            background-color: #f6f6f6; /* Light grey background like the image */
            border-radius: 4px;
            margin-bottom: 15px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-card img {
            max-width: 85%;
            height: auto;
            mix-blend-mode: multiply; /* Helps blend white-background images */
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
            margin-top: 10px;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <header>
