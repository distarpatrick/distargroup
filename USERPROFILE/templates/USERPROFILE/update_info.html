{% extends 'USERPROFILE/base.html' %}
{% load static %}
{% block content %}
<style>
    .update-container {
        max-width: 800px;
        margin: 120px auto 60px;
        padding: 0 20px;
    }

    .settings-grid {
        display: grid;
        grid-template-columns: 250px 1fr;
        gap: 30px;
    }

    /* Left Sidebar */
    .settings-nav {
        background: white;
        border-radius: 15px;
        padding: 20px;
        height: fit-content;
        box-shadow: var(--shadow);
    }

    .nav-btn {
        display: block;
        padding: 12px 15px;
        color: var(--text-light);
        text-decoration: none;
        font-weight: 600;
        border-radius: 8px;
        transition: 0.3s;
        margin-bottom: 5px;
    }

    .nav-btn.active {
        background: #f0fdf4;
        color: var(--accent);
    }

    /* Main Form Card */
    .form-card {
        background: white;
        border-radius: 15px;
        padding: 40px;
        box-shadow: var(--shadow);
    }

    .profile-upload {
        position: relative;
        width: 100px;
        height: 100px;
        margin-bottom: 30px;
    }

    .profile-upload img {
        width: 100%; height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--accent);
    }

    .file-input-label {
        position: absolute; bottom: 0; right: 0;
        background: var(--primary); color: white;
        width: 32px; height: 32px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; font-size: 14px;
    }

    .form-group { margin-bottom: 20px; }
    .form-group label {
        display: block; margin-bottom: 8px;
        font-weight: 700; font-size: 14px; color: var(--primary);
    }

    .form-control {
        width: 100%; padding: 12px 15px;
        border: 1px solid #e2e8f0; border-radius: 8px;
        font-size: 15px; transition: 0.3s;
    }

    .form-control:focus {
        border-color: var(--accent);
        outline: none;
        box-shadow: 0 0 0 3px rgba(0, 210, 127, 0.1);
    }

    .btn-save {
        background: var(--primary); color: white;
        border: none; padding: 15px 30px;
        border-radius: 8px; font-weight: 700;
        cursor: pointer; width: 100%;
        transition: 0.3s;
    }

    .btn-save:hover { background: #002d5c; transform: translateY(-2px); }

    /* SMS Notification Simulation */
    #sms-alert {
        display: none;
        position: fixed; top: 20px; right: 20px;
        background: #1e293b; color: white;
        padding: 15px 25px; border-radius: 10px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        z-index: 2000; animation: slideIn 0.5s ease;
    }

    @keyframes slideIn { from { right: -300px; } to { right: 20px; } }

    /* Media Queries */
    @media (max-width: 768px) {
        .settings-grid { grid-template-columns: 1fr; }
        .settings-nav { display: none; }
    }
</style>

<div id="sms-alert">
    <i class="fa-solid fa-comment-sms" style="color: var(--accent); margin-right: 10px;"></i>
    <span>SMS Notification Sent!</span>
</div>

<div class="update-container">
    <h2 style="margin-bottom: 30px;">Account Settings</h2>

    <div class="settings-grid">
        <aside class="settings-nav">
            <a href="#" class="nav-btn active"><i class="fa-solid fa-user-gear"></i> Public Profile</a>
            <a href="{% url 'USERPROFILE:order_history' %}" class="nav-btn"><i class="fa-solid fa-box"></i> Orders</a>
            <a href="#" class="nav-btn"><i class="fa-solid fa-shield-halved"></i> Security</a>
        </aside>

        <section class="form-card">
            <form action="{% url 'USERPROFILE:profile_info' %}" method="POST" enctype="multipart/form-data" id="updateForm">
                {% csrf_token %}
                
                <div class="profile-upload">
                    {% if profile.image %}
                        <img id="imgPreview" src="{{ profile.image.url }}" alt="Avatar">
                    {% else %}
                        <img id="imgPreview" src="https://ui-avatars.com/api/?name={{ user.username }}" alt="Avatar">
                    {% endif %}
                    <label for="profile_image" class="file-input-label">
                        <i class="fa-solid fa-camera"></i>
                    </label>
                    <input type="file" name="profile_image" id="profile_image" style="display: none;" onchange="previewImage(this)">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" value="{{ user.email }}">
                </div>

                <div class="form-group">
                    <label>Phone Number (for SMS Alerts)</label>
                    <input type="text" name="phone" class="form-control" placeholder="+250 7xx xxx xxx" value="{{ profile.phone_number }}">
                </div>

                <button type="submit" class="btn-save">Update Profile</button>
            </form>
        </section>
    </div>
</div>

<script>
    // Image Preview logic
    function previewImage(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imgPreview').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // SMS Animation on Submit
    document.getElementById('updateForm').onsubmit = function() {
        const alert = document.getElementById('sms-alert');
        alert.style.display = 'block';
        setTimeout(() => {
            alert.style.display = 'none';
        }, 4000);
    };
</script>
